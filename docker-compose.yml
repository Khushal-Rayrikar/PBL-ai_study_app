version: '3.8'

services:
  backend:
    build:
      context: ./ai-study-assistant
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./ai-study-assistant:/app
    command: python main.py
    networks:
      - cortexa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./ui_app/aca-mind-ui
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    depends_on:
      - backend
    networks:
      - cortexa-network
    environment:
      - VITE_API_URL=http://backend:8000

networks:
  cortexa-network:
    driver: bridge

volumes:
  backend_data:
