name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-levels: '34'
        build-tools-version: '34.0.0'

    - name: Install dependencies (Frontend)
      working-directory: ./ui_app/cortexa
      run: npm install

    - name: Build frontend
      working-directory: ./ui_app/cortexa
      run: npm run build

    - name: Install Capacitor CLI
      run: npm install -g @capacitor/cli @capacitor/android

    - name: Add Android platform
      working-directory: ./ui_app/cortexa
      run: npx cap add android

    - name: Sync web assets
      working-directory: ./ui_app/cortexa
      run: npx cap sync android

    - name: Build APK
      working-directory: ./ui_app/cortexa/android
      run: ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: cortexa-apk
        path: ui_app/cortexa/android/app/build/outputs/apk/debug/
        retention-days: 30

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: ui_app/cortexa/android/app/build/outputs/apk/debug/*.apk
        tag_name: v${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
