name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'aca-mind-ui/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./aca-mind-ui
        run: npm ci
      
      - name: Build web version
        working-directory: ./aca-mind-ui
        run: npm run build
      
      - name: Create web release package
        working-directory: ./aca-mind-ui
        run: npm run pack:web
      
      - name: Get version
        working-directory: ./aca-mind-ui
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Get date
        id: date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}-${{ steps.date.outputs.DATE }}
          release_name: ACA Mind v${{ steps.version.outputs.VERSION }} - ${{ steps.date.outputs.DATE }}
          body: |
            # 🚀 ACA Mind Release
            
            ## 📥 Downloads
            - **Web Version**: Download the web package below
            - **Android Version**: Coming soon
            
            ## ✨ Features
            - 📊 Time vs Marks Analysis
            - 🎯 AI-powered "Focus On" page
            - 🧠 Adaptive Quiz System
            - 📚 Revision & Theory Pages
            - 🎨 Modern glassmorphism UI
            - 📈 Unit-wise Performance Breakdown
            
            ## 🌐 Quick Start (Web)
            1. Download the web package
            2. Extract it
            3. Run: `python -m http.server 8000`
            4. Visit: http://localhost:8000
            
            See [RELEASE.md](https://github.com/Khushal-Rayrikar/PBL-ai_study_app/blob/main/aca-mind-ui/RELEASE.md) for detailed instructions.
          draft: false
          prerelease: false
      
      - name: Upload web artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./releases/aca-mind-ui-v${{ steps.version.outputs.VERSION }}-${{ steps.date.outputs.DATE }}
          asset_name: aca-mind-ui-v${{ steps.version.outputs.VERSION }}-${{ steps.date.outputs.DATE }}.zip
          asset_content_type: application/zip

  android-build:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-version: 33
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'aca-mind-ui/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./aca-mind-ui
        run: npm ci
      
      - name: Build for Android
        working-directory: ./aca-mind-ui
        run: npm run cap:build:android
      
      - name: Build APK
        working-directory: ./aca-mind-ui/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      
      - name: Get version
        working-directory: ./aca-mind-ui
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Get date
        id: date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      
      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.build.outputs.upload_url }}
          asset_path: ./aca-mind-ui/android/app/build/outputs/apk/release/app-release.apk
          asset_name: aca-mind-ui-v${{ steps.version.outputs.VERSION }}-${{ steps.date.outputs.DATE }}.apk
          asset_content_type: application/vnd.android.package-archive
        if: success()
